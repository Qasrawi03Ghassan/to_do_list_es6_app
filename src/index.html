<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>To do list app | G.Q</title>

    <link rel="stylesheet" href="/src/css/styles.css" />
    <script src="/src/scripts/script.js" type="module" defer></script>
  </head>

  <body>
    <header>
      <div class="header-content">
        <span class="logo">✓</span>

        <div>
          <h1>To do list application</h1>
        </div>
      </div>
    </header>

    <main>
      <section id="inputSec">
        <div class="input-wrapper">
          <span class="input-icon">＋</span>

          <label>
            <input
              id="elemField"
              type="text"
              title="Elements input"
              placeholder="What needs to be done?"
              autocomplete="off"
            />
          </label>
        </div>

        <button id="addBtn" type="button">
          <span>+</span>
          Add task
        </button>

        <button id="promiseBtn" type="button">
          <span>+</span>
          Make promises
        </button>
      </section>

      <section id="outputSec">
        <div class="section-header">
          <div>
            <h2>Today's tasks</h2>
            <p id="taskCount">0 tasks remaining</p>
          </div>

          <button id="clearCompleted" type="button" class="clear-btn">
            Clear completed
          </button>
        </div>

        <div id="duties">
          <ul></ul>
        </div>
      </section>
    </main>

    <footer>
      <p>Created by Ghassan Qasrawi @ AlAhd Technology Solutions company</p>
    </footer>
  </body>
</html>
