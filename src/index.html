<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To do list app | G.Q</title>
  </head>
  <body>
    <header>
      <h1>To do list app</h1>
    </header>
    <main>
      <section id="inputSec">
        <label>
          <input
            id="elemField"
            type="text"
            title="Elements input"
            placeholder="Enter a new element/item here"
          />
        </label>
        <button type="button">Add element</button>
      </section>
      <section id="outputSec">
        <h2>Available duties for tody:</h2>
        <div id="duties">
          <ul>
            <li>
              <p>Duty 1</p>
              <button type="button">Mark as done</button>
              <button type="button">Remove</button>
            </li>
            <li>
              <p>Duty 2</p>
              <button type="button">Mark as done</button>
              <button type="button">Remove</button>
            </li>
            <li>
              <p>Duty 3</p>
              <button type="button">Mark as done</button>
              <button type="button">Remove</button>
            </li>
          </ul>
        </div>
      </section>
    </main>
    <footer>
      <p>Created by Ghassan Qasrawi @ AlAhd Technology Solutions company</p>
    </footer>
  </body>
</html>
